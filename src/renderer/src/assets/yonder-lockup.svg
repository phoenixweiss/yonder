      <path d="M575 -24Q417 -24 302.5 47Q188 118 126.5 242.5Q65 367 65 527Q65 688 128.5 813Q192 938 305 1009Q418 1080 564 1080Q678 1080 770 1040Q862 1000 928 926.5Q994 853 1029.5 752.5Q1065 652 1065 530V465H163V634H945L840 586Q840 679 806.5 747Q773 815 712 852Q651 889 567 889Q485 889 424 852Q363 815 329.5 747Q296 679 296 586V484Q296 390 329 318Q362 246 425.5 206Q489 166 580 166Q645 166 695.5 186Q746 206 780 241.5Q814 277 828 324H1051Q1031 221 964.5 143Q898 65 797.5 20.5Q697 -24 575 -24Z" transform="translate(4579)"/>
      <path d="M114 0V1056H342V883H345Q374 972 436.5 1019.5Q499 1067 601 1067Q625 1067 646 1066Q667 1065 681 1063V850Q668 852 635 855Q602 858 565 858Q506 858 457 831Q408 804 379.5 748.5Q351 693 351 609V0Z" transform="translate(5685)"/>
    </g>
  </defs>

  <svg x="24" y="86" width="340" height="340" viewBox="0 0 1024 1024" overflow="visible">
    <use href="#lockup-mark"/>
  </svg>
  <g fill="currentColor" transform="translate(350 328) scale(0.105 -0.105)">
    <use href="#lockup-wordmark"/>
  </g>
</svg>
