      <path d="M351 601V0H114V1056H346V790H297Q348 931 441 1004Q534 1077 669 1077Q779 1077 864.5 1029.5Q950 982 999 889Q1048 796 1048 659V0H811V624Q811 745 753.5 807Q696 869 591 869Q523 869 468.5 841Q414 813 382.5 754Q351 695 351 601Z" transform="translate(2264)"/>
