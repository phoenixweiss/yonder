<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 512" role="img" aria-labelledby="title description" style="color:#2166f3">
  <title id="title">Yonder horizontal logo</title>
  <desc id="description">The approved flat passage mark paired with the Yonder wordmark.</desc>
  <metadata>
    Primary horizontal lockup.
    Mark geometry: normalized orthographic isometric cube from yonder-mark-flat.svg.
    Wordmark source: Inter 4.1, weight 560, optical size 32, converted to outlines.
    Wordmark tracking: -20 font units between glyphs.
    Change the root color property to recolor the complete lockup.
  </metadata>

  <defs>
    <path id="lockup-rear-frame" d="M0 0H100V100H0Z M18 18H82V82H18Z"
      transform="matrix(-3.550704 2.05 0 -4.1 512 512)"
      fill-rule="evenodd"/>
    <path id="lockup-front-frame" d="M0 0H100V100H0Z M18 18H82V82H18Z"
      transform="matrix(-3.550704 2.05 0 -4.1 867.0704 717)"
      fill-rule="evenodd"/>
    <path id="lockup-passage-shell" d="
      M302.5085 391.05
      L366.4211 354.15
      L721.4915 559.15
      L721.4915 632.95
      L657.5789 669.85
      L302.5085 464.85 Z"/>
    <path id="lockup-passage-left-face" d="
      M302.5085 391.05
      L366.4211 354.15
      L366.4211 427.95
      L302.5085 464.85 Z"/>
    <path id="lockup-passage-right-face" d="
      M657.5789 596.05
      L721.4915 559.15
      L721.4915 632.95
      L657.5789 669.85 Z"/>

    <clipPath id="lockup-passage-shell-clip"><use href="#lockup-passage-shell"/></clipPath>
    <clipPath id="lockup-passage-left-clip"><use href="#lockup-passage-left-face"/></clipPath>
    <clipPath id="lockup-passage-right-clip"><use href="#lockup-passage-right-face"/></clipPath>

    <g id="lockup-passage-shape" fill="none" stroke="currentColor" stroke-width="16" stroke-linejoin="miter">
      <use href="#lockup-passage-shell" clip-path="url(#lockup-passage-shell-clip)"/>
      <use href="#lockup-passage-left-face" clip-path="url(#lockup-passage-left-clip)"/>
      <use href="#lockup-passage-right-face" clip-path="url(#lockup-passage-right-clip)"/>
    </g>

    <mask id="lockup-frames-minus-passage" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <use href="#lockup-passage-shape" color="#000"/>
    </mask>
    <mask id="lockup-passage-minus-frames" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <use href="#lockup-rear-frame" fill="#000"/>
      <use href="#lockup-front-frame" fill="#000"/>
    </mask>

    <g id="lockup-mark">
      <g fill="currentColor" mask="url(#lockup-frames-minus-passage)">
        <use href="#lockup-rear-frame"/>
        <use href="#lockup-front-frame"/>
      </g>
      <use href="#lockup-passage-shape" mask="url(#lockup-passage-minus-frames)"/>
    </g>

    <!-- Inter 4.1 outlines, wght 560, opsz 32. -->
    <g id="lockup-wordmark">
