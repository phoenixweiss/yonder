    destinationOccupied: Назначение оказалось занято. Ничего не заменено; проверьте хранилище снова.
    sourceMissing: Источник больше недоступен. Ничего не создано; проверьте хранилище снова.
    parentsMissing: Папка назначения отсутствует. Yonder не будет создавать папки.
    stateChanged: Во время подготовки изменилась конфигурация или файловая система. Ничего не создано; проверьте снова.
    recoveryRequired: Исход предыдущей операции не определён. Yonder не будет автоматически повторять её.
    journalUnavailable: Закрытый локальный журнал операций недоступен, поэтому применение отключено.
    journalInvalid: Локальный журнал операций изменён или повреждён, поэтому применение отключено.
    journalWriteUncertain: Yonder не смог подтвердить запись намерения операции. Команда создания ссылки не отправлялась.
    creationUncertain: Команда создания ссылки могла быть доставлена, но итог не удалось доказать. Не повторяйте операцию; откройте применение снова для проверки записи.
    notReady: Подключение больше не готово к применению. Проверьте хранилище снова.
    unavailable: Yonder не удалось безопасно подготовить или завершить применение. Перед повтором проверьте хранилище.
