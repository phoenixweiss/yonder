  observations:
    absent: По записанному назначению ссылка не видна. Исход операции остаётся неопределённым; не повторяйте её автоматически.
    conflict: По записанному назначению находится другой объект. Yonder ничего не заменит.
    stateChanged: Записанные файлы или папки изменились. Автоматическое восстановление заблокировано.
  errors:
    invalidSelection: Срок действия выбора хранилища истёк. Откройте папку снова.
    selectionExpired: Срок действия одноразового подтверждения истёк. Вернитесь к хранилищу и подготовьте применение заново.
    unsupportedPlatform: Применение пока доступно только в проверенных сборках для macOS.
