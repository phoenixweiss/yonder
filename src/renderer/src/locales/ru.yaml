preview:
  title: Предпросмотр подключения
  intro: Проверьте предлагаемое изменение для «{{name}}».
  proposedOperation: Предлагаемая операция
  source: Источник в хранилище
  destination: Назначение на этом компьютере
  effect: Yonder предложит создать одну символическую ссылку в назначении, ведущую к источнику.
  unchanged: Приложение не будет перемещать, удалять или заменять файлы, изменять yonder.yaml или создавать папки.
  note: Предпросмотр не даёт полномочий на запись. Применение заново проверяет состояние в main process и запрашивает финальное подтверждение.
  open: Предпросмотр…
  back: Вернуться к хранилищу
  nextStep: 'Следующий шаг:'
  operations:
    createLink: Создать одну символическую ссылку
  reasons:
    ready: Проверить предлагаемую ссылку, затем отдельно подготовить подтверждаемое применение.
    connected: Сохранить существующую ссылку; изменений не предлагается.
    targetOccupied: Разрешить занятое назначение вручную и проверить снова. Ничего не будет заменено.
    targetMismatch: Проверить ссылку, ведущую в другое место, и повторить проверку. Ничего не будет заменено.
    sourceMissing: Сделать источник доступным в хранилище или исправить yonder.yaml, затем проверить снова.
    notConfigured: Пропустить на этом компьютере; подключение настроено для другой операционной системы.
    targetParentMissing: Создать папку назначения вручную и проверить снова. Предпросмотр не создаёт папки.
    targetParentUnsafe: Выбрать прямую папку назначения без переходов через символические ссылки и проверить снова.
    sourceUnsafe: Использовать прямой обычный файл или папку внутри хранилища, а не символическую ссылку.
    sourceUnsupported: Источник должен быть обычным файлом или папкой.
    inspectionFailed: Устранить проблему проверки и проверить снова. Изменений не предлагается.
apply:
  prepare: Подготовить применение
  preparing: Повторная проверка…
