connectionDraft:
  open: Add connection…
  title: Add a connection
  intro: Describe one existing storage item and where its symbolic link would live on this Mac.
  typeRule: A file creates a file-to-file connection; a folder creates a folder-to-folder connection. Yonder preserves the source type.
  type: Type
  name: Connection name
  id: Identifier
  idHint: Lowercase letters, numbers, and hyphens. The identifier stays stable if the display name changes later.
  source: Source in storage
  chooseSource: Choose source…
  targetParent: Destination folder on this Mac
  chooseTargetParent: Choose folder…
  linkName: Link name
  resultingTarget: 'Resulting target:'
  notSelected: Not selected
  readOnlyNote: Choosing paths and reviewing the draft do not edit yonder.yaml or create the symbolic link. Writing requires a separate final confirmation.
  review: Review connection
  checking: Checking…
  back: Back to storage
  previewTitle: Connection draft preview
  previewIntro: Review the exact paths and proposed YAML entry. Nothing has been written.
  configFile: Configuration file
  destination: Destination on this computer
  yamlEntry: Proposed YAML entry
  previewEffect: Preparing the update rereads the source, destination folder, and configuration before enabling the final confirmation.
  previewUnchanged: The confirmed update changes only yonder.yaml by adding this entry. It does not create folders or links, or move, delete, or replace other files.
  previewNote: Preparation is not write authority. A one-time final confirmation is required before yonder.yaml changes.
  prepareWrite: Prepare configuration update
  preparingWrite: Checking configuration…
  confirmTitle: Ready to update yonder.yaml
  confirmEffect: Fresh checks passed. Confirming will replace only this configuration with a validated version containing the proposed entry.
