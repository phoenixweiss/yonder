preview:
  title: Connection preview
  intro: Review the proposed change for “{{name}}”.
  proposedOperation: Proposed operation
  source: Source in storage
  destination: Destination on this computer
  effect: Yonder would create one symbolic link at the destination pointing to the source.
  unchanged: It would not move, delete, or replace files, edit yonder.yaml, or create folders.
  note: This preview is not write authority. Apply performs fresh main-process checks and asks for one final confirmation.
  open: Preview…
  back: Back to storage
  nextStep: 'Next step:'
  operations:
    createLink: Create one symbolic link
  reasons:
    ready: Review the proposed link, then prepare a separately confirmed Apply.
    connected: Keep the existing link; no change is proposed.
    targetOccupied: Resolve the occupied destination manually, then check again. Nothing will be replaced.
    targetMismatch: Review the link that points elsewhere, then check again. Nothing will be replaced.
    sourceMissing: Make the source available in storage or correct yonder.yaml, then check again.
    notConfigured: Skip on this computer; this connection is configured for another operating system.
    targetParentMissing: Create the destination folder manually, then check again. Preview does not create folders.
    targetParentUnsafe: Use a direct destination folder without symbolic-link redirects, then check again.
    sourceUnsafe: Use a direct regular file or folder inside storage, not a symbolic link.
    sourceUnsupported: The source must be a regular file or folder.
    inspectionFailed: Resolve the inspection problem, then check again. No change is proposed.
disconnect:
  available: Remove this verified link later without changing the configuration or source.
  open: Disconnect…
  title: Disconnect connection
  intro: Review the exact link that would be removed for “{{name}}”.
  operation: Remove one symbolic link
  effect: Yonder will remove only the symbolic link at the destination after checking that it still points exactly to this source.
  unchanged: The source, yonder.yaml, destination folder, and every other file or link remain unchanged.
  note: This screen is not removal authority. Preparation performs fresh main-process and anchored native checks; one final confirmation is still required.
  prepare: Prepare disconnect
  preparing: Checking again…
  readyTitle: Fresh checks completed
  readyText: The verified destination folder is held open. Confirm once to remove exactly this matching symbolic link.
  checkedAt: 'Checked at:'
  confirm: Remove this link
  disconnecting: Removing link…
  cancel: Cancel disconnect
  back: Back to storage
  disconnected: The symbolic link was removed and independently checked. The configuration and source were unchanged.
  disconnectedRefreshFailed: The link was removed, but the dashboard could not be refreshed. Check the storage again before continuing.
  errors:
    invalidSelection: This storage selection has expired. Open the folder again.
    selectionExpired: This one-time confirmation has expired. Return to the storage and prepare disconnect again.
    unsupportedPlatform: Disconnect is currently available only on verified macOS builds.
    operationBusy: Another link operation is still active. Wait and try again.
    notConnected: This destination is no longer the connected symbolic link. Nothing was removed; check the storage again.
    linkMismatch: The destination is not the exact Yonder link expected for this source. Nothing was removed.
    stateChanged: The configuration, source, destination, or parent folder changed during preparation. Nothing was removed; check again.
    removalUncertain: Yonder could not prove whether the link was removed. Do not repeat the action blindly; check the storage and destination first.
    notReady: This connection is not ready for safe disconnect. Nothing was removed.
    unavailable: Yonder could not prepare or complete disconnect. Nothing else was changed.
apply:
  prepare: Prepare Apply
  preparing: Checking again…
  readyTitle: Fresh checks completed
  readyText: The verified destination folder is held open. Confirm once to create exactly this symbolic link.
  checkedAt: 'Checked at:'
  confirm: Create this link
  applying: Creating link…
  cancel: Cancel Apply
  connected: The symbolic link was created and independently checked.
  connectedRefreshFailed: The link was created, but the dashboard could not be refreshed. Check the storage again; do not repeat Apply.
  recoveryObservation: Recorded operation observation
  observations:
    absent: No link is visible at the recorded destination. The outcome remains uncertain; do not retry automatically.
    conflict: Another entry is visible at the recorded destination. Nothing will be replaced.
    stateChanged: The recorded files or folders changed. Automatic recovery is blocked.
  errors:
    invalidSelection: This storage selection has expired. Open the folder again.
    selectionExpired: This one-time confirmation has expired. Return to the storage and prepare Apply again.
    unsupportedPlatform: Apply is currently available only on verified macOS builds.
    operationBusy: Another link operation is still active. Wait and try again.
    destinationOccupied: The destination became occupied. Nothing was replaced; check the storage again.
    sourceMissing: The source is no longer available. Nothing was created; check the storage again.
    parentsMissing: The destination folder is missing. Yonder will not create folders.
    stateChanged: The configuration or filesystem changed during preparation. Nothing was created; check again.
    recoveryRequired: A previous operation has an unresolved outcome. Yonder will not retry it automatically.
    journalUnavailable: The private local operation journal is unavailable, so Apply is disabled.
    journalInvalid: The local operation journal changed or is invalid, so Apply is disabled.
    journalWriteUncertain: Yonder could not prove that the operation intent was saved. No link command was sent.
    creationUncertain: The link command may have been delivered, but the final outcome could not be proven. Do not retry; reopen Apply to inspect the recorded operation.
    notReady: This connection is no longer ready for Apply. Check the storage again.
    unavailable: Yonder could not prepare or finish Apply safely. Check the storage before trying again.
