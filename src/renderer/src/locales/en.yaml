  confirmWrite: Add to yonder.yaml
  writing: Updating…
  cancelWrite: Cancel
  created: The connection was added to yonder.yaml. No symbolic link was created.
  createdRefreshFailed: The connection was added to yonder.yaml, but the refreshed storage could not be displayed. Open the storage again before continuing.
