appId: io.github.phoenixweiss.yonder
productName: Yonder
copyright: Copyright © 2026 PAVEL TKACHEV

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - package.json

extraResources:
  - from: build/native/yonder-link-helper
    to: native/yonder-link-helper
  - from: LICENSE
    to: LICENSE

npmRebuild: false
electronLanguages:
  - en-US
  - ru

mac:
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  icon: resources/icon.icns
  identity: null
  hardenedRuntime: false
  artifactName: ${productName}-${version}-${arch}.${ext}

dmg:
  title: ${productName} ${version}
  artifactName: ${productName}-${version}-${arch}.${ext}
