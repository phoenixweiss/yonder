appId: io.github.phoenixweiss.yonder
productName: Yonder
copyright: Copyright © 2026 PAVEL TKACHEV

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - package.json

extraResources:
  - from: build/native/yonder-link-helper
    to: native/yonder-link-helper
  - from: LICENSE
    to: LICENSE

npmRebuild: false
electronLanguages:
  - en-US
  - ru

mac:
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  icon: resources/icon.icns
  identity: '-'
  hardenedRuntime: false
  artifactName: ${productName}-${version}-${arch}.${ext}

dmg:
  title: ${productName} ${version}
  artifactName: ${productName}-${version}-${arch}.${ext}
  background: resources/dmg-background.tiff
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 128
      type: file
    - x: 410
      y: 128
      type: link
      path: /Applications
