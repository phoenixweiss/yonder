<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" role="img" aria-labelledby="title description">
  <title id="title">Yonder app icon size sheet</title>
  <desc id="description">The transparent-corner macOS Yonder app icon alongside smaller rendered sizes.</desc>

  <defs>
    <clipPath id="mask-large"><rect x="90" y="120" width="760" height="760" rx="171"/></clipPath>
    <clipPath id="mask-256"><rect x="1080" y="226" width="256" height="256" rx="58"/></clipPath>
    <clipPath id="mask-128"><rect x="1420" y="290" width="128" height="128" rx="29"/></clipPath>
    <clipPath id="mask-64"><rect x="1112" y="680" width="64" height="64" rx="15"/></clipPath>
    <clipPath id="mask-32"><rect x="1452" y="696" width="32" height="32" rx="8"/></clipPath>
    <filter id="sheet-shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#26364f" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1800" height="1200" fill="#dfe4ec"/>
  <text x="90" y="82" fill="#667085" font-family="system-ui, sans-serif" font-size="24" font-weight="600" letter-spacing="2">SYSTEM MASK PREVIEW</text>

  <g filter="url(#sheet-shadow)">
    <image href="yonder-app-icon.png" x="90" y="120" width="760" height="760" clip-path="url(#mask-large)"/>
  </g>

  <text x="1010" y="82" fill="#667085" font-family="system-ui, sans-serif" font-size="24" font-weight="600" letter-spacing="2">SIZE CHECK</text>

  <image href="yonder-app-icon.png" x="1080" y="226" width="256" height="256" clip-path="url(#mask-256)"/>
  <text x="1080" y="530" fill="#667085" font-family="system-ui, sans-serif" font-size="22">256 px</text>

  <image href="yonder-app-icon.png" x="1420" y="290" width="128" height="128" clip-path="url(#mask-128)"/>
  <text x="1420" y="466" fill="#667085" font-family="system-ui, sans-serif" font-size="22">128 px</text>

  <image href="yonder-app-icon.png" x="1112" y="680" width="64" height="64" clip-path="url(#mask-64)"/>
  <text x="1080" y="792" fill="#667085" font-family="system-ui, sans-serif" font-size="22">64 px</text>

  <image href="yonder-app-icon.png" x="1452" y="696" width="32" height="32" clip-path="url(#mask-32)"/>
  <text x="1420" y="776" fill="#667085" font-family="system-ui, sans-serif" font-size="22">32 px</text>

  <text x="90" y="1050" fill="#344054" font-family="system-ui, sans-serif" font-size="34" font-weight="650">Yonder</text>
  <text x="90" y="1098" fill="#667085" font-family="system-ui, sans-serif" font-size="23">Default light app-icon direction · transparent-corner 1024 × 1024 macOS master</text>
</svg>
